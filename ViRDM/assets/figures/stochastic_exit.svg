<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 530" role="img" aria-labelledby="title desc">
  <title id="title">Full rollout and ViRDM stochastic exit</title>
  <desc id="desc">Video states are circles connected by curved arrows. The upper row runs four steps before RDM. The lower row alternates clean predictions and re-noising until a sampled exit.</desc>
  <defs>
    <marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#98a5b4"/></marker>
    <marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#ff6733"/></marker>
    <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2f7ee6"/></marker>
    <style>
      :root{--ink:#13233e;--muted:#7c899b;--line:#d9dee6;--orange:#ff6733;--soft:#fff0e9;--blue:#2f7ee6;--blue-soft:#edf5ff;--green:#208978;--green-soft:#ebf8f5;--top:10s;--bottom:12s}
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink)}.rowtitle{font-family:Georgia,"Times New Roman",serif;font-size:31px;font-weight:600}.rowsub{font-size:13px;fill:var(--muted)}.phase{font-size:11px;font-weight:850;letter-spacing:1.15px;fill:var(--orange);text-anchor:middle}.phase.nogradlabel{fill:#7c899b}.label{font-size:13px;font-weight:800;text-anchor:middle}.backnote{font-size:16px;font-weight:850;letter-spacing:.65px;fill:var(--orange);text-anchor:middle}.exitbadge{font-size:13px;font-weight:850;letter-spacing:.8px;fill:var(--orange);text-anchor:middle}.sub{font-size:11px;font-weight:750;fill:var(--muted);text-anchor:middle}
      .video{fill:#fff;stroke:#bcc6d1;stroke-width:2}.generator{fill:var(--soft);stroke:var(--orange);stroke-width:2}.generator.nograd{fill:#f0f2f5;stroke:#9aa6b5}.loss{fill:var(--green-soft);stroke:#75b6aa;stroke-width:2}.curve{fill:none;stroke:#98a5b4;stroke-width:2.5;stroke-linecap:round;marker-end:url(#gray)}.renoise{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linecap:round;marker-end:url(#blue)}.back{fill:none;stroke:var(--orange);stroke-width:3;stroke-linecap:round;marker-end:url(#orange)}
      .base{opacity:.16}.focus{opacity:0}.phasebox{stroke-width:3}.phasebox.grad{fill:#fff9f5;stroke:var(--orange);filter:drop-shadow(0 0 9px rgba(255,103,51,.22))}.phasebox.nograd{fill:#fafbfc;stroke:#9aa6b5;filter:drop-shadow(0 0 7px rgba(90,105,122,.15))}.focus .video,.focus .generator,.focus .loss{filter:drop-shadow(0 0 9px rgba(255,103,51,.20))}.focus .curve,.focus .renoise,.focus .back{stroke-dasharray:12 8;animation:flow .8s linear infinite}
      .t1{animation:t1 var(--top) infinite}.t2{animation:t2 var(--top) infinite}.t3{animation:t3 var(--top) infinite}.t4{animation:t4 var(--top) infinite}.t5{animation:t5 var(--top) infinite}.b1{animation:b1 var(--bottom) infinite}.b2{animation:b2 var(--bottom) infinite}.b3{animation:b3 var(--bottom) infinite}.b4{animation:b4 var(--bottom) infinite}.b5{animation:b5 var(--bottom) infinite}.b6{animation:b6 var(--bottom) infinite}
      @keyframes flow{to{stroke-dashoffset:-20}}@keyframes t1{0%,18%{opacity:1}20%,100%{opacity:0}}@keyframes t2{0%,19%,40%,100%{opacity:0}20%,38%{opacity:1}}@keyframes t3{0%,39%,60%,100%{opacity:0}40%,58%{opacity:1}}@keyframes t4{0%,59%,80%,100%{opacity:0}60%,78%{opacity:1}}@keyframes t5{0%,79%{opacity:0}80%,98%{opacity:1}100%{opacity:0}}@keyframes b1{0%,15%{opacity:1}17%,100%{opacity:0}}@keyframes b2{0%,16%,34%,100%{opacity:0}17%,32%{opacity:1}}@keyframes b3{0%,33%,51%,100%{opacity:0}34%,49%{opacity:1}}@keyframes b4{0%,50%,68%,100%{opacity:0}51%,66%{opacity:1}}@keyframes b5{0%,67%,85%,100%{opacity:0}68%,83%{opacity:1}}@keyframes b6{0%,84%{opacity:0}85%,98%{opacity:1}100%{opacity:0}}
    </style>
  </defs>
  <rect width="1500" height="530" fill="#fff"/>
  <text x="30" y="40" class="rowtitle">Full four-step rollout</text>

  <!-- Top base chain -->
  <g class="base">
    <circle class="video" cx="65" cy="132" r="42"/><text class="label" x="65" y="129">Noisy Video</text><text class="sub" x="65" y="146">t=1000</text><path class="curve" d="M107 132H151"/>
    <rect class="generator" x="154" y="94" width="132" height="76" rx="18"/><text class="label" x="220" y="128">Causal</text><text class="label" x="220" y="147">Generator</text><path class="curve" d="M286 132H330"/>
    <circle class="video" cx="372" cy="132" r="42"/><text class="label" x="372" y="129">Noisy Video</text><text class="sub" x="372" y="146">t=750</text><path class="curve" d="M414 132H458"/>
    <rect class="generator" x="461" y="94" width="132" height="76" rx="18"/><text class="label" x="527" y="128">Causal</text><text class="label" x="527" y="147">Generator</text><path class="curve" d="M593 132H637"/>
    <circle class="video" cx="679" cy="132" r="42"/><text class="label" x="679" y="129">Noisy Video</text><text class="sub" x="679" y="146">t=500</text><path class="curve" d="M721 132H765"/>
    <rect class="generator" x="768" y="94" width="132" height="76" rx="18"/><text class="label" x="834" y="128">Causal</text><text class="label" x="834" y="147">Generator</text><path class="curve" d="M900 132H944"/>
    <circle class="video" cx="986" cy="132" r="42"/><text class="label" x="986" y="129">Noisy Video</text><text class="sub" x="986" y="146">t=250</text><path class="curve" d="M1028 132H1072"/>
    <rect class="generator" x="1075" y="94" width="132" height="76" rx="18"/><text class="label" x="1141" y="128">Causal</text><text class="label" x="1141" y="147">Generator</text><path class="curve" d="M1207 132H1251"/>
    <circle class="video" cx="1293" cy="132" r="42"/><text class="label" x="1293" y="129">Clean Video</text><text class="sub" x="1293" y="146">t=0</text><path class="curve" d="M1335 132H1369"/>
    <rect class="loss" x="1372" y="96" width="100" height="72" rx="18"/><text class="label" x="1422" y="129">RDM</text><text class="label" x="1422" y="148">Loss</text>
  </g>
  <!-- Top active phases, no enclosing boxes -->
  <g class="focus t1"><rect class="phasebox grad" x="18" y="65" width="396" height="126" rx="19"/><text class="phase" x="220" y="84">PHASE 1 · GRAD</text><circle class="video" cx="65" cy="132" r="42"/><text class="label" x="65" y="129">Noisy Video</text><text class="sub" x="65" y="146">t=1000</text><path class="curve" d="M107 132H151"/><rect class="generator" x="154" y="94" width="132" height="76" rx="18"/><text class="label" x="220" y="128">Causal</text><text class="label" x="220" y="147">Generator</text><path class="curve" d="M286 132H330"/><circle class="video" cx="372" cy="132" r="42"/><text class="label" x="372" y="129">Noisy Video</text><text class="sub" x="372" y="146">t=750</text></g>
  <g class="focus t2"><rect class="phasebox grad" x="324" y="65" width="398" height="126" rx="19"/><text class="phase" x="527" y="84">PHASE 2 · GRAD</text><circle class="video" cx="372" cy="132" r="42"/><text class="label" x="372" y="129">Noisy Video</text><text class="sub" x="372" y="146">t=750</text><path class="curve" d="M414 132H458"/><rect class="generator" x="461" y="94" width="132" height="76" rx="18"/><text class="label" x="527" y="128">Causal</text><text class="label" x="527" y="147">Generator</text><path class="curve" d="M593 132H637"/><circle class="video" cx="679" cy="132" r="42"/><text class="label" x="679" y="129">Noisy Video</text><text class="sub" x="679" y="146">t=500</text></g>
  <g class="focus t3"><rect class="phasebox grad" x="631" y="65" width="398" height="126" rx="19"/><text class="phase" x="834" y="84">PHASE 3 · GRAD</text><circle class="video" cx="679" cy="132" r="42"/><text class="label" x="679" y="129">Noisy Video</text><text class="sub" x="679" y="146">t=500</text><path class="curve" d="M721 132H765"/><rect class="generator" x="768" y="94" width="132" height="76" rx="18"/><text class="label" x="834" y="128">Causal</text><text class="label" x="834" y="147">Generator</text><path class="curve" d="M900 132H944"/><circle class="video" cx="986" cy="132" r="42"/><text class="label" x="986" y="129">Noisy Video</text><text class="sub" x="986" y="146">t=250</text></g>
  <g class="focus t4"><rect class="phasebox grad" x="938" y="65" width="398" height="126" rx="19"/><text class="phase" x="1141" y="84">PHASE 4 · GRAD</text><circle class="video" cx="986" cy="132" r="42"/><text class="label" x="986" y="129">Noisy Video</text><text class="sub" x="986" y="146">t=250</text><path class="curve" d="M1028 132H1072"/><rect class="generator" x="1075" y="94" width="132" height="76" rx="18"/><text class="label" x="1141" y="128">Causal</text><text class="label" x="1141" y="147">Generator</text><path class="curve" d="M1207 132H1251"/><circle class="video" cx="1293" cy="132" r="42"/><text class="label" x="1293" y="129">Clean Video</text><text class="sub" x="1293" y="146">t=0</text></g>
  <g class="focus t5"><rect class="phasebox grad" x="1245" y="65" width="235" height="126" rx="19"/><text class="phase" x="1362" y="84">PHASE 5 · GRAD</text><circle class="video" cx="1293" cy="132" r="42"/><text class="label" x="1293" y="129">Clean Video</text><text class="sub" x="1293" y="146">t=0</text><path class="curve" d="M1335 132H1369"/><rect class="loss" x="1372" y="96" width="100" height="72" rx="18"/><text class="label" x="1422" y="129">RDM</text><text class="label" x="1422" y="148">Loss</text><path class="back" d="M1372 167Q1256 224 1141 170"/><path class="back" d="M1075 170Q954 224 834 170"/><path class="back" d="M768 170Q647 224 527 170"/><path class="back" d="M461 170Q340 224 220 170"/></g>

  <text x="750" y="230" class="backnote">ONE BACKWARD GRAPH SPANS THE COMPLETE TRAJECTORY</text>
  <line x1="30" y1="254" x2="1470" y2="254" stroke="#dfe4ea"/>
  <text x="30" y="298" class="rowtitle" fill="#ff6733">ViRDM stochastic exit</text><rect x="1280" y="270" width="190" height="38" rx="19" fill="#fff0e9" stroke="#ff6733" stroke-width="2"/><text x="1375" y="295" class="exitbadge">EXAMPLE EXIT = 3</text>
  <!-- Bottom base chain -->
  <g class="base">
    <circle class="video" cx="55" cy="410" r="40"/><text class="label" x="55" y="407">Noisy Video</text><text class="sub" x="55" y="424">t=1000</text><path class="curve" d="M95 410H131"/><rect class="generator" x="134" y="374" width="112" height="72" rx="17"/><text class="label" x="190" y="406">Causal</text><text class="label" x="190" y="424">Generator</text><path class="curve" d="M246 410H282"/><circle class="video" cx="322" cy="410" r="40"/><text class="label" x="322" y="407">Clean Video</text><text class="sub" x="322" y="424">t=0</text>
    <path class="renoise" d="M362 410H460"/><circle class="video" cx="500" cy="410" r="40"/><text class="label" x="500" y="407">Noisy Video</text><text class="sub" x="500" y="424">t=750</text><path class="curve" d="M540 410H576"/><rect class="generator" x="579" y="374" width="112" height="72" rx="17"/><text class="label" x="635" y="406">Causal</text><text class="label" x="635" y="424">Generator</text><path class="curve" d="M691 410H727"/><circle class="video" cx="767" cy="410" r="40"/><text class="label" x="767" y="407">Clean Video</text><text class="sub" x="767" y="424">t=0</text>
    <path class="renoise" d="M807 410H905"/><circle class="video" cx="945" cy="410" r="40"/><text class="label" x="945" y="407">Noisy Video</text><text class="sub" x="945" y="424">t=500</text><path class="curve" d="M985 410H1021"/><rect class="generator" x="1024" y="374" width="112" height="72" rx="17"/><text class="label" x="1080" y="406">Causal</text><text class="label" x="1080" y="424">Generator</text><path class="curve" d="M1136 410H1172"/><circle class="video" cx="1212" cy="410" r="40"/><text class="label" x="1212" y="407">Clean Video</text><text class="sub" x="1212" y="424">t=0</text><path class="curve" d="M1252 410H1288"/><rect class="loss" x="1291" y="374" width="126" height="72" rx="17"/><text class="label" x="1354" y="416">RDM Loss</text>
  </g>
  <!-- Bottom active phases -->
  <g class="focus b1"><rect class="phasebox nograd" x="9" y="344" width="359" height="124" rx="19"/><text class="phase nogradlabel" x="190" y="363">PHASE 1 · NO GRAD</text><circle class="video" cx="55" cy="410" r="40"/><text class="label" x="55" y="407">Noisy Video</text><text class="sub" x="55" y="424">t=1000</text><path class="curve" d="M95 410H131"/><rect class="generator nograd" x="134" y="374" width="112" height="72" rx="17"/><text class="label" x="190" y="406">Causal</text><text class="label" x="190" y="424">Generator</text><path class="curve" d="M246 410H282"/><circle class="video" cx="322" cy="410" r="40"/><text class="label" x="322" y="407">Clean Video</text><text class="sub" x="322" y="424">t=0</text></g>
  <g class="focus b2"><rect class="phasebox nograd" x="276" y="344" width="272" height="124" rx="19"/><text class="phase nogradlabel" x="411" y="363">PHASE 2 · RE-NOISE · NO GRAD</text><circle class="video" cx="322" cy="410" r="40"/><text class="label" x="322" y="407">Clean Video</text><text class="sub" x="322" y="424">t=0</text><path class="renoise" d="M362 410H460"/><circle class="video" cx="500" cy="410" r="40"/><text class="label" x="500" y="407">Noisy Video</text><text class="sub" x="500" y="424">t=750</text></g>
  <g class="focus b3"><rect class="phasebox nograd" x="454" y="344" width="359" height="124" rx="19"/><text class="phase nogradlabel" x="635" y="363">PHASE 3 · NO GRAD</text><circle class="video" cx="500" cy="410" r="40"/><text class="label" x="500" y="407">Noisy Video</text><text class="sub" x="500" y="424">t=750</text><path class="curve" d="M540 410H576"/><rect class="generator nograd" x="579" y="374" width="112" height="72" rx="17"/><text class="label" x="635" y="406">Causal</text><text class="label" x="635" y="424">Generator</text><path class="curve" d="M691 410H727"/><circle class="video" cx="767" cy="410" r="40"/><text class="label" x="767" y="407">Clean Video</text><text class="sub" x="767" y="424">t=0</text></g>
  <g class="focus b4"><rect class="phasebox nograd" x="721" y="344" width="272" height="124" rx="19"/><text class="phase nogradlabel" x="856" y="363">PHASE 4 · RE-NOISE · NO GRAD</text><circle class="video" cx="767" cy="410" r="40"/><text class="label" x="767" y="407">Clean Video</text><text class="sub" x="767" y="424">t=0</text><path class="renoise" d="M807 410H905"/><circle class="video" cx="945" cy="410" r="40"/><text class="label" x="945" y="407">Noisy Video</text><text class="sub" x="945" y="424">t=500</text></g>
  <g class="focus b5"><rect class="phasebox grad" x="899" y="344" width="359" height="124" rx="19"/><text class="phase" x="1080" y="363">PHASE 5 · SAMPLED EXIT · GRAD</text><circle class="video" cx="945" cy="410" r="40"/><text class="label" x="945" y="407">Noisy Video</text><text class="sub" x="945" y="424">t=500</text><path class="curve" d="M985 410H1021"/><rect class="generator" x="1024" y="374" width="112" height="72" rx="17"/><text class="label" x="1080" y="406">Causal</text><text class="label" x="1080" y="424">Generator</text><path class="curve" d="M1136 410H1172"/><circle class="video" cx="1212" cy="410" r="40"/><text class="label" x="1212" y="407">Clean Video</text><text class="sub" x="1212" y="424">t=0</text></g>
  <g class="focus b6"><rect class="phasebox grad" x="1166" y="344" width="258" height="124" rx="19"/><text class="phase" x="1295" y="363">PHASE 6 · GRAD</text><circle class="video" cx="1212" cy="410" r="40"/><text class="label" x="1212" y="407">Clean Video</text><text class="sub" x="1212" y="424">t=0</text><path class="curve" d="M1252 410H1288"/><rect class="loss" x="1291" y="374" width="126" height="72" rx="17"/><text class="label" x="1354" y="416">RDM Loss</text><path class="back" d="M1354 446Q1217 504 1080 446"/></g>
  <text x="1210" y="510" class="backnote">ONE SELECTED CLEAN ENDPOINT · ONE BACKWARD GRAPH</text>
</svg>
